[project]
name = "wr-hubspot"
version = "0.1.0"
description = "Keboola HubSpot Writer Component"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component==1.6.8",
    "requests==2.28.1",
    "urllib3==1.26.11",
]

[dependency-groups]
dev = [
    "freezegun==1.2.1",
    "mock==4.0.3",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
